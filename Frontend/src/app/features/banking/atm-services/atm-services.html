<!-- ATM SERVICES -->
<div class="page-panel" id="panel-atm">
  <div style="font-size:13px; color:var(--text-secondary); margin-bottom:16px;">Bank service operations — POST
    /bank-service endpoints</div>
  <div class="atm-grid">

    <div class="service-card">

      <div class="service-card-header">
        <div class="service-icon icon-deposit">
          <i class="ti ti-arrow-down" aria-hidden="true"></i>
        </div>

        <div>
          <div class="service-card-title">Deposit Money</div>
          <div class="service-card-sub">POST /bank-service/deposit</div>
        </div>
      </div>

      <form [formGroup]="depositForm" (ngSubmit)="depositMoney()">

        <div class="form-row-full">
          <label class="form-label">Account Number</label>
          <input class="form-input-sm" type="number" formControlName="accountNumber" placeholder="e.g. 10000001">
        </div>

        <div class="form-row-full">
          <label class="form-label">Amount (₹)</label>
          <input class="form-input-sm" type="number" formControlName="amount" placeholder="e.g. 25,000">
        </div>

        <button type="submit" class="btn-service btn-deposit">
          <i class="ti ti-arrow-down"></i>
          Deposit Money
        </button>

      </form>

    </div>

    <div class="service-card">

      <div class="service-card-header">
        <div class="service-icon icon-withdraw">
          <i class="ti ti-arrow-up" aria-hidden="true"></i>
        </div>

        <div>
          <div class="service-card-title">Withdraw Money</div>
          <div class="service-card-sub">POST /bank-service/withdraw</div>
        </div>
      </div>

      <form [formGroup]="withdrawForm" (ngSubmit)="withdrawMoney()">

        <div class="form-row-full">
          <label class="form-label">Account Number</label>
          <input class="form-input-sm" type="number" formControlName="accountNumber" placeholder="e.g. 10000001">
        </div>

        <div class="form-row-full">
          <label class="form-label">Amount (₹)</label>
          <input class="form-input-sm" type="number" formControlName="amount" placeholder="e.g. 8,500">
        </div>

        <button type="submit" class="btn-service btn-withdraw">
          <i class="ti ti-arrow-up"></i>
          Withdraw Money
        </button>

      </form>

    </div>

    <div class="service-card" style="grid-column: span 2;">

      <div class="service-card-header">
        <div class="service-icon icon-transfer">
          <i class="ti ti-arrows-exchange" aria-hidden="true"></i>
        </div>

        <div>
          <div class="service-card-title">Transfer Money</div>
          <div class="service-card-sub">POST /bank-service/transfer</div>
        </div>
      </div>

      <form [formGroup]="transferForm" (ngSubmit)="transferMoney()">

        <div style="display:grid; grid-template-columns:1fr auto 1fr 180px; gap:12px; align-items:flex-end;">

          <div>

            <label class="form-label">From Account Number</label>
            <input class="form-input-sm" type="number" formControlName="fromAccountNumber" placeholder="e.g. 10000001">

          </div>

          <div style="display:flex; align-items:center; padding-bottom:4px; color:var(--text-muted);">
            <i class="ti ti-arrow-right" style="font-size:22px;" aria-hidden="true"></i>
          </div>

          <div>

            <label class="form-label">To Account Number</label>
            <input class="form-input-sm" type="number" formControlName="toAccountNumber" placeholder="e.g. 10000008">

          </div>

          <div>

            <label class="form-label">Amount (₹)</label>
            <input class="form-input-sm" type="number" formControlName="amount" placeholder="e.g. 50,000">

          </div>

        </div>

        <button type="submit" class="btn-service btn-transfer" style="margin-top:14px;">
          <i class="ti ti-arrows-exchange"></i>
          Transfer Money
        </button>

      </form>

    </div>

  </div>
</div>

<div class="recent-transactions-card">

  <div class="card-header">
    <div>
      <h3>Recent Transactions</h3>
      <p>Latest 5 ATM service transactions</p>
    </div>

    <button class="btn-view-all" routerLink="/app/transactions">
      View All
      <i class="ti ti-arrow-right"></i>
    </button>
  </div>

  <div class="tx-table-wrap">

    <table class="banking-data-table">

      <thead>
        <tr>
          <th>Tx ID</th>
          <th>Type</th>
          <th>Account</th>
          <th>Amount</th>
          <th>Date & Time</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>

        <!-- Rows -->

      </tbody>

    </table>

  </div>

</div>
